name: Validate Main Release PR Dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: python -m pip install --disable-pip-version-check --no-input hatch

      - name: Create build environment
        run: hatch env create build_github
