[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_secrets"
dynamic = ["version"]
description = "Mountain Ash — capability-graded secret-store port"
readme = "README.md"
requires-python = ">=3.12"
keywords = []
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-secrets#readme"
Issues = "https://github.com/mountainash-io/mountainash-secrets/issues"
Source = "https://github.com/mountainash-io/mountainash-secrets"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

#================
# Tool: Coverage
#================
[tool.coverage.run]
source_pkgs = ["mountainash_secrets", "tests"]
branch = true
parallel = true
omit = ["src/mountainash_secrets/__version__.py"]

[tool.coverage.paths]
mountainash_secrets = [
    "src/mountainash_secrets",
    "*/mountainash-secrets/src/mountainash_secrets",
]
tests = ["tests", "*/mountainash-secrets/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]

#================
# Tool: Mypy
#================
[tool.mypy]
# Keep the existing third-party typing policy; installed consumers are verified
# separately without these import suppressions.
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
